services:
  # 1. Message Broker for Celery Background Jobs
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Flask API Server (Backend)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  # 3. Celery Background Worker (AI & Parsing Engine)
  celery:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: celery -A tasks worker --loglevel=info --concurrency=1
    env_file:
      - ./server/.env
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  # 4. React Single Page Application (Frontend served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # Map to standard HTTP port on the host
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
